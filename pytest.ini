[pytest]
testpaths = tests
pythonpath = .
addopts = -ra -m "not selfcheck"
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
markers =
    smoke: quick sanity scenarios
    regression: full regression scenarios
    external: talks to a third-party site (e.g. Google); excluded in CI
    selfcheck: offline self-tests of the framework engine
    fixme: known-broken scenario, skipped until fixed
    skip: scenario disabled
